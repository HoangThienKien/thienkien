  const tmp = {x:A.x, y:A.y, r:A.r, s:A.s}; A.x = B.x; A.y = B.y; A.r = B.r; A.s = B.s; B.x = tmp.x; B.y = tmp.y; B.r = tmp.r; B.s = tmp.s;
  syncMeshes(); state.swapFrom = null; modeTip(null); changed(); select(a, false);
  toast('Đã đổi chỗ '+CBY[a].name+' và '+CBY[b].name+'.');
}

    + '<scr'+'ipt id="layout-data" type="application/json">' + json + '</scr'+'ipt>\n'

async function saveShared(){
  if (!state.artifact || state.saving) return;
  const savedAt = new Date().toISOString();
  const doc = buildDoc({savedAt, tables: state.tables.map(t => ({id:t.id, x:t.x, y:t.y, r:t.r, tv:t.tv, s:t.s})), shapes: state.shapes});
  state.saving = true; renderSave();
  try { sessionStorage.setItem(SS_KEY, savedAt); } catch(e){}
  try {
    await state.artifact.publish(doc);
    clearDraft();
  } catch(err){
    state.saving = false;
    try { sessionStorage.removeItem(SS_KEY); } catch(e){}
    const c = err && err.code;
    if (c === 'conflict') toast('Có người vừa lưu một phương án khác. Trang sẽ tải lại bản mới, thay đổi của bạn vẫn còn trong bản nháp trên máy này.');
    else if (c === 'not_writer' || c === 'not_granted' || c === 'consent_required' || c === 'capability_disabled' || c === 'capability_removed' || c === 'not_declared'){ state.readOnly = true; toast('Bạn chỉ có quyền xem trang này. Dùng Phương án, Sao chép phương án để gửi cách xếp cho người quản lý trang.'); }
    else if (c === 'rate_limited') toast('Lưu quá nhiều lần liên tiếp. Đợi một lát rồi lưu lại.');
    else if (c === 'too_large') toast('Trang vượt giới hạn dung lượng nên chưa lưu được.');
    else toast('Chưa lưu được do lỗi kết nối. Thử lại sau ít giây.');
    renderSave();
  }
}

  if (state.selShape){
    if (k === 'r'){ rotShape(90); return; }

    if (k === 'delete' || k === 'backspace'){ e.preventDefault(); delShape(); return; }
    const st = e.shiftKey ? 0.5 : 0.1;
    const ar = {arrowup:[0,-st], arrowdown:[0,st], arrowleft:[-st,0], arrowright:[st,0]};
    if (ar[k] && !state.eye){ e.preventDefault(); nudgeShape(ar[k][0], ar[k][1]); return; }
  }
  if (state.selected){
    if (k === 'r'){ rotateSel(90); return; }
    if (k === 'e'){ rotateSel(45); return; }
    const step = e.shiftKey ? 0.5 : 0.1;
    const arrows = {arrowup:[0,-step], arrowdown:[0,step], arrowleft:[-step,0], arrowright:[step,0]};
    if (arrows[k] && !state.eye){ e.preventDefault(); nudge(arrows[k][0], arrows[k][1]); return; }
  }
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys.add(k); if (k.startsWith('arrow')) e.preventDefault(); }
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => keys.clear());

/* ---------- hai cần điều khiển (chế độ tầm mắt): trái để đi, phải để nhìn quanh ---------- */
const joyEl = $('#joy'), joy2El = $('#joy2');
let joyHinted = false, rotDismissed = false;
const isTouch = () => (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || window.innerWidth <= 760;
function makeStick(el){
  const st = {x:0, y:0, active:false, id:null}, kn = el.querySelector('.joy-knob');
  const mv = e => {
    const r = el.getBoundingClientRect(); const max = r.width/2 - 16;
    let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
    const d = Math.hypot(dx, dy); if (d > max){ dx *= max/d; dy *= max/d; }
    kn.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)'; st.x = dx/max; st.y = dy/max;
  };
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); st.active = true; st.id = e.pointerId; try { el.setPointerCapture(e.pointerId); } catch(err){} mv(e); });
  el.addEventListener('pointermove', e => { if (st.active && e.pointerId === st.id) mv(e); });
  const end = e => { if (e.pointerId !== st.id) return; st.active = false; st.id = null; st.x = st.y = 0; kn.style.transform = ''; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  return st;
}
const joy = makeStick(joyEl), joy2 = makeStick(joy2El);
function updateJoy(){
  const eye = state.eye, touch = isTouch();
  joyEl.hidden = !eye; joy2El.hidden = !(eye && touch);
  if (!eye) rotDismissed = false;
  const coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  $('#rot-hint').hidden = !(eye && coarse && window.innerHeight > window.innerWidth && !rotDismissed);
  if (eye && !joyHinted){ joyHinted = true; if (!touch) toast('Kéo cần tròn bên trái hoặc dùng phím mũi tên để đi. W S để nhìn lên xuống, A D để quay trái phải.'); }
}
$('#rot-dismiss').onclick = () => { rotDismissed = true; updateJoy(); };
window.addEventListener('resize', updateJoy);
window.addEventListener('orientationchange', () => setTimeout(updateJoy, 150));

/* ---------- loop ---------- */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  const vb = $('#views'); if (vb) stage.style.setProperty('--vbar', vb.offsetHeight + 'px');
}
new ResizeObserver(resize).observe(stage);
/* Sau khi xoay màn hình, một số trình duyệt di động báo chiều cao cũ. Đo lại nhiều lần để khung hình luôn phủ kín phần nhìn thấy. */
function fitViewport(){
  const vv = window.visualViewport;
  const h = Math.max(window.innerHeight || 0, vv ? Math.round(vv.height + (vv.offsetTop || 0)) : 0, document.documentElement.clientHeight || 0);
  document.documentElement.style.setProperty('--app-h', h + 'px');
  if (window.scrollY || window.scrollX) window.scrollTo(0, 0);
  resize();
}
['resize', 'orientationchange'].forEach(ev => window.addEventListener(ev, () => { fitViewport(); [120, 400, 900, 1600].forEach(ms => setTimeout(fitViewport, ms)); }));
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitViewport);
fitViewport();
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (keys.size){
    const sp = (state.eye ? 2.6 : 9) * dt;
    const f = (keys.has('arrowup') ? 1 : 0) - (keys.has('arrowdown') ? 1 : 0);
    const s = (keys.has('arrowright') ? 1 : 0) - (keys.has('arrowleft') ? 1 : 0);
    if (f || s) walk(f*sp, s*sp);
    const rs = (state.eye ? 1.3 : 1.0) * dt;
    const yaw = ((keys.has('a') ? 1 : 0) - (keys.has('d') ? 1 : 0)) * rs;
    const pitch = ((keys.has('w') ? 1 : 0) - (keys.has('s') ? 1 : 0)) * rs * 0.8;
    if (yaw || pitch) look(yaw, pitch);
  }
  if (joy.active){
    const mag = Math.hypot(joy.x, joy.y);
    if (mag > 0.1){ const k = 2.6*dt*Math.min(1, (mag-0.1)/0.9)/mag; walk(-joy.y*k, joy.x*k); }
  }
  if (joy2.active && state.eye){
    const mag = Math.hypot(joy2.x, joy2.y);
    if (mag > 0.1){ const k = Math.pow(Math.min(1, (mag-0.1)/0.9), 1.4)/mag; look(-joy2.x*k*1.9*dt, -joy2.y*k*1.5*dt); }
  }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}
const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme(){
  scene.background = new THREE.Color(css('--scene') || '#EEF1F7');
  if (floorMat && !state.carpet) floorMat.color.set(css('--floor') || '#ffffff');
  if (hallMat) hallMat.color.set(css('--hall') || '#E2E7F0');
}
if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);

/* ---------- start ---------- */
async function start(){
  try { await Promise.race([Promise.all([document.fonts.load('800 60px Archivo'), document.fonts.load('600 40px Archivo')]), new Promise(r => setTimeout(r, 2500))]); } catch(e){}
  buildStatic();
  state.tables.forEach(buildTable); syncShapes();
  renderGroups(); renderShapeList(); refreshIssues(); renderList(); renderSave();
  setView('overview'); resize();
  $('#loading').remove();
  requestAnimationFrame(loop);
  let justSaved = null; try { justSaved = sessionStorage.getItem(SS_KEY); } catch(e){}
  if (justSaved && justSaved === state.savedAt){ try { sessionStorage.removeItem(SS_KEY); } catch(e){} clearDraft(); toast('Đã lưu. Ai mở trang này đều thấy phương án mới.'); }
  else if (state.fromLink){ toast('Đang xem phương án được chia sẻ qua link.'); }
  else checkDraft();
}
start();

if (window.claude && typeof window.claude.use === 'function'){
  window.claude.use('artifact').then(ns => { state.artifact = ns || null; renderSave(); }).catch(() => { state.artifact = null; renderSave(); });
} else { state.artifact = null; }
})();
</script>
</body></html>
