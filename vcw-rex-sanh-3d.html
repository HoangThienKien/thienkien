const POLY = [[0,2.9],[0.6,2.9],[0.6,-4],[4.8,-4],[4.8,2.9],[14.4,2.9],[14.4,0],[28.6,0],[28.6,2.87],[32,2.87],[32,9.1],[29.6,11.5],[0,11.5]];
const COLUMNS = [

  {x0:7.7,y0:10.28,x1:8.4,y1:11.5,kind:'trụ tường'},
  {x0:16.74,y0:10.28,x1:17.44,y1:11.5,kind:'trụ tường'},
  {x0:22.74,y0:10.28,x1:23.44,y1:11.5,kind:'trụ tường'}

const FORE_DEPTH = 3.5;

const TW = 1.8, TD = 0.8, ZONE = 0.55;

function rectPoly(r){ return [[r.x0,r.y0],[r.x1,r.y0],[r.x1,r.y1],[r.x0,r.y1]]; }
function tableGeom(t){
  const a = t.r*Math.PI/180;
  const fx = Math.sin(a), fy = -Math.cos(a);
  const ux = Math.cos(a), uy = Math.sin(a);
  const hw = TW/2, hd = TD/2;
  const P = (su, sf) => [t.x + ux*su + fx*sf, t.y + uy*su + fy*sf];
  return {
    body:[P(-hw,-hd),P(hw,-hd),P(hw,hd),P(-hw,hd)],
    zone:[P(-hw,-hd),P(hw,-hd),P(hw,-hd-ZONE),P(-hw,-hd-ZONE)]
  };
}
function overlap(a, b){
  const eps = 0.01;
  for (const poly of [a,b]){
    for (let i=0;i<poly.length;i++){
      const p = poly[i], q = poly[(i+1)%poly.length];
      let ax = q[1]-p[1], ay = p[0]-q[0];
      const len = Math.hypot(ax,ay) || 1; ax/=len; ay/=len;
      let minA=Infinity,maxA=-Infinity,minB=Infinity,maxB=-Infinity;
      for (const v of a){ const d=v[0]*ax+v[1]*ay; if(d<minA)minA=d; if(d>maxA)maxA=d; }
      for (const v of b){ const d=v[0]*ax+v[1]*ay; if(d<minB)minB=d; if(d>maxB)maxB=d; }
      if (maxA-minB < eps || maxB-minA < eps) return false;
    }
  }
  return true;
}
function pointIn(pt, poly){
  let inside = false;
  for (let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    if (((yi>pt[1]) !== (yj>pt[1])) && (pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}
function allInside(pts){
  let cx=0, cy=0; pts.forEach(p=>{cx+=p[0];cy+=p[1];}); cx/=pts.length; cy/=pts.length;
  return pts.every(p => { const dx=cx-p[0], dy=cy-p[1], l=Math.hypot(dx,dy)||1; return pointIn([p[0]+dx/l*0.006, p[1]+dy/l*0.006], POLY); });
}
function code(id){ return id.slice(0,2)+'-'+id.slice(2); }
function computeIssues(tables){
  const geo = {}; tables.forEach(t => { geo[t.id] = tableGeom(t); });
  const byId = {}; const list = [];
  const add = (id, msg) => { (byId[id] = byId[id] || []); if (byId[id].indexOf(msg) < 0){ byId[id].push(msg); list.push({id, msg}); } };
  tables.forEach(t => {
    const g = geo[t.id];
    if (!allInside(g.body)) add(t.id, 'vượt ra ngoài sảnh hoặc đè lên tường');
    else if (!allInside(g.zone)) add(t.id, 'phía sau không đủ chỗ cho exhibitor đứng');
    COLUMNS.forEach(c => {
      const rp = rectPoly(c);
      if (overlap(g.body, rp)) add(t.id, 'đè lên '+c.kind);
      else if (overlap(g.zone, rp)) add(t.id, c.kind.charAt(0).toUpperCase()+c.kind.slice(1)+' chắn chỗ đứng phía sau bàn');
    });
    FORECOURTS.forEach(f => { if (overlap(g.body, rectPoly(f))) add(t.id, 'nằm trong khoảng trống trước '+f.label); });
  });
  for (let i=0;i<tables.length;i++){
    for (let j=i+1;j<tables.length;j++){
      const A = tables[i], B = tables[j], ga = geo[A.id], gb = geo[B.id];
      if (overlap(ga.body, gb.body)){ add(A.id, 'chồng lên bàn '+code(B.id)); add(B.id, 'chồng lên bàn '+code(A.id)); }
      else {
        if (overlap(ga.zone, gb.body)) add(A.id, 'bàn '+code(B.id)+' chắn chỗ đứng phía sau');
        if (overlap(gb.zone, ga.body)) add(B.id, 'bàn '+code(A.id)+' chắn chỗ đứng phía sau');
      }
    }
  }
  return {list, byId};
}

function textCanvas(lines, opt){
  const c = document.createElement('canvas'); const ctx = c.getContext('2d');
  c.width = opt.w; c.height = opt.h;
  if (opt.bg){ ctx.fillStyle = opt.bg; if (opt.radius){ roundRect(ctx, 0, 0, c.width, c.height, opt.radius); ctx.fill(); } else ctx.fillRect(0,0,c.width,c.height); }
  ctx.fillStyle = opt.fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach(L => {
    let fs = L.size; ctx.font = `${L.weight} ${fs}px Archivo, "Helvetica Neue", Arial, sans-serif`;
    while (ctx.measureText(L.text).width > c.width - 40 && fs > 14){ fs -= 2; ctx.font = `${L.weight} ${fs}px Archivo, "Helvetica Neue", Arial, sans-serif`; }
    ctx.globalAlpha = L.alpha || 1; ctx.fillText(L.text, c.width/2, L.y); ctx.globalAlpha = 1;
  });
  return c;
}
function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function sprite(text, size, fg, bg){
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = `600 56px Archivo, Arial, sans-serif`;
  const w = Math.ceil(probe.measureText(text).width) + 56;
  const c = textCanvas([{text, size:56, weight:600, y:46}], {w, h:92, fg, bg, radius:18});
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  sp.scale.set(size*c.width/c.height, size, 1); sp.renderOrder = 20;
  return sp;
}

  if ((e.ctrlKey || e.metaKey) && k === 'z'){ e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === 'escape'){ if (state.measureMode) setMeasure(false); else if (state.swapFrom) cancelSwap(); else select(null); return; }
  if (state.selected){
    if (k === 'r'){ rotateSel(90); return; }
    if (k === 'e'){ rotateSel(45); return; }
    const step = e.shiftKey ? 0.5 : 0.1;
    const arrows = {arrowup:[0,-step], arrowdown:[0,step], arrowleft:[-step,0], arrowright:[step,0]};
    if (arrows[k]){ e.preventDefault(); nudge(arrows[k][0], arrows[k][1]); return; }
  }
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys.add(k); if (k.startsWith('arrow')) e.preventDefault(); }
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => keys.clear());

/* ---------- loop ---------- */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (keys.size){
    const sp = (state.eye ? 2.6 : 9) * dt;
    const f = (keys.has('w')||keys.has('arrowup') ? 1 : 0) - (keys.has('s')||keys.has('arrowdown') ? 1 : 0);
    const s = (keys.has('d')||keys.has('arrowright') ? 1 : 0) - (keys.has('a')||keys.has('arrowleft') ? 1 : 0);
    if (f || s) walk(f*sp, s*sp);
  }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}
const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme(){
  scene.background = new THREE.Color(css('--scene') || '#EEF1F7');
  if (floorMat) floorMat.color.set(css('--floor') || '#ffffff');
  if (hallMat) hallMat.color.set(css('--hall') || '#E2E7F0');
}
if (mq && mq.addEventListener) mq.addEventListener('change', applyTheme);

/* ---------- start ---------- */
async function start(){
  try { await Promise.race([Promise.all([document.fonts.load('800 60px Archivo'), document.fonts.load('600 40px Archivo')]), new Promise(r => setTimeout(r, 2500))]); } catch(e){}
  buildStatic();
  state.tables.forEach(buildTable);
  renderGroups(); refreshIssues(); renderList(); renderSave();
  setView('overview'); resize();
  $('#loading').remove();
  requestAnimationFrame(loop);
  let justSaved = null; try { justSaved = sessionStorage.getItem(SS_KEY); } catch(e){}
  if (justSaved && justSaved === state.savedAt){ try { sessionStorage.removeItem(SS_KEY); } catch(e){} clearDraft(); toast('Đã lưu. Ai mở trang này đều thấy phương án mới.'); }
  else checkDraft();
}
start();

if (window.claude && typeof window.claude.use === 'function'){
  window.claude.use('artifact').then(ns => { state.artifact = ns || null; renderSave(); }).catch(() => { state.artifact = null; renderSave(); });
} else { state.artifact = null; }
})();
</script>
