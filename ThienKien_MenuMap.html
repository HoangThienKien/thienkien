<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thiện Kiến Food Atlas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#112D42;display:flex;height:100vh;overflow:hidden;}

/* Map */
#map-col{flex:0 0 380px;height:100vh;overflow:hidden;background:#112D42;position:relative;}
#map-col svg{display:block;}

/* Sidebar */
#sidebar{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#0d2234;border-left:1px solid #1e3f59;}

/* Header */
#sidebar-header{padding:12px 20px 12px;border-bottom:1px solid #1e3f59;flex-shrink:0;}
#sidebar-header h1{font-size:16px;font-weight:700;color:#e8f0f7;letter-spacing:-.01em;}
#sidebar-header p{font-size:11px;color:#4a7a9b;margin-top:2px;}
#back-link{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:#4a7a9b;text-decoration:none;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;transition:color .15s;}
#back-link:hover{color:#7aafc8;}
#back-link svg{transition:transform .15s;}
#back-link:hover svg{transform:translateX(-2px);}

/* Filters */
#filters{padding:10px 20px;border-bottom:1px solid #1e3f59;flex-shrink:0;}
.filter-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px;}
.filter-btn{font-size:11px;padding:3px 9px;border-radius:10px;border:1px solid #1e3f59;background:transparent;cursor:pointer;color:#7aafc8;transition:all .15s;}
.filter-btn.active{color:#fff;border-color:transparent;}
.filter-btn:hover{opacity:.85;}

/* Detail panel — 2-column: text left, image right */
#detail{padding:0;border-bottom:1px solid #1e3f59;flex-shrink:0;display:none;background:#0a1c2b;position:relative;}
#detail.visible{display:flex;flex-direction:row;}
#detail-left{flex:1;min-width:0;padding:14px 16px;position:relative;}
#detail-close{position:absolute;top:10px;right:12px;font-size:18px;color:#4a7a9b;cursor:pointer;line-height:1;z-index:2;}
#detail-close:hover{color:#e8f0f7;}
#detail-name-en{font-size:14px;font-weight:700;color:#e8f0f7;margin-bottom:2px;padding-right:20px;}
#detail-name-vi{font-size:11px;color:#4a7a9b;margin-bottom:8px;}
#detail-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.badge{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600;}
#detail-ingredients{margin-bottom:8px;}
#detail-ingredients h3{font-size:10px;font-weight:700;color:#4a7a9b;letter-spacing:.08em;margin-bottom:6px;}
.ingredient-item{display:flex;gap:6px;align-items:baseline;margin-bottom:4px;}
.ing-en{font-size:12px;color:#c8dce9;font-weight:500;}
.ing-vi{font-size:11px;color:#4a7a9b;}
#detail-events h3{font-size:10px;font-weight:700;color:#4a7a9b;letter-spacing:.08em;margin-bottom:4px;}
#detail-events p{font-size:11px;color:#7aafc8;}

/* Dish list */
#list-wrap{flex:1;overflow-y:auto;padding:8px 0;}
.dish-row{display:flex;align-items:flex-start;gap:10px;padding:7px 20px;cursor:pointer;border-left:3px solid transparent;transition:background .1s;}
.dish-row:hover{background:#112D42;}
.dish-row.active{background:#0f2638;border-left-color:#5b9ec9;}
.dish-row.dimmed{opacity:.2;}
.row-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.row-en{font-size:12px;color:#c8dce9;font-weight:500;line-height:1.3;}
.row-vi{font-size:10px;color:#2e5570;margin-top:1px;}
.row-region{font-size:10px;margin-top:1px;}

/* Search */
#search-wrap{padding:8px 20px 6px;flex-shrink:0;}
#search-input{width:100%;background:#112D42;border:1px solid #1e3f59;border-radius:8px;padding:7px 12px 7px 32px;font-size:12px;color:#e8f0f7;outline:none;font-family:inherit;}
#search-input::placeholder{color:#4a7a9b;}
#search-input:focus{border-color:#2e6a94;}
#search-wrap{position:relative;}
#search-icon{position:absolute;left:32px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.4;}

/* Scrollbar */
#list-wrap::-webkit-scrollbar{width:4px;}
#list-wrap::-webkit-scrollbar-track{background:transparent;}
#list-wrap::-webkit-scrollbar-thumb{background:#1e3f59;border-radius:2px;}

/* Dish image — right column, height = panel height, width = height × 16/9 */
#detail-img-wrap{flex-shrink:0;align-self:stretch;aspect-ratio:16/9;position:relative;background:#0d2234;border-left:1px solid #1e3f59;min-width:80px;}
#detail-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;}
#detail-img-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;}
#detail-img-ph svg{opacity:.3;}
#detail-img-filename{font-size:7px;color:#2e5570;font-family:monospace;text-align:center;word-break:break-all;line-height:1.4;}

/* Tooltip */
#tooltip{position:fixed;display:none;background:#0a1c2b;color:#e8f0f7;border:1px solid #1e3f59;border-radius:8px;
  padding:8px 12px;font-size:12px;pointer-events:none;z-index:9999;max-width:220px;line-height:1.5;}
</style>
</head>

// ── MAP SETUP ─────────────────────────────────────────────────────────────
const W = 380, H = window.innerHeight;
const svg = d3.select('#map').append('svg')
  .attr('width', W).attr('height', H);

const proj = d3.geoMercator().center([107, 16.5]).scale(1850).translate([W/2, H/2]);
const path = d3.geoPath(proj);

function getRegion(name) {
  const n = name.toLowerCase();
  if (/hoa binh|son la|dien bien|lai chau|lao cai|yen bai/.test(n)) return 'Tây Bắc Bộ';
  if (/ha giang|cao bang|bac kan|lang son|tuyen quang|thai nguyen|bac giang|quang ninh|phu tho/.test(n)) return 'Đông Bắc Bộ';
  if (/ha noi|hai phong|hai duong|hung yen|thai binh|nam dinh|ninh binh|ha nam|vinh phuc|bac ninh/.test(n)) return 'Đồng Bằng Sông Hồng';
  if (/thanh hoa|nghe an|ha tinh|quang binh|quang tri|thua thien/.test(n)) return 'Bắc Trung Bộ';
  if (/da nang|quang nam|quang ngai|binh dinh|phu yen|khanh hoa|ninh thuan|binh thuan/.test(n)) return 'Nam Trung Bộ';
  if (/dak lak|dak nong|lam dong|gia lai|kon tum/.test(n)) return 'Tây Nguyên';
  if (/ho chi minh|binh duong|dong nai|ba ria|vung tau|binh phuoc|tay ninh/.test(n)) return 'Đông Nam Bộ';
  if (/long an|tien giang|ben tre|tra vinh|vinh long|dong thap|an giang|kien giang|can tho|hau giang|soc trang|bac lieu|ca mau/.test(n)) return 'Mekong Delta';
  return null;
}

const tip = document.getElementById('tooltip');
let activeRegion = null, activeType = null, activeSearch = '', selectedDish = null;

d3.json('https://cdn.jsdelivr.net/npm/datamaps@0.5.10/src/js/data/vnm.topo.json').then(topo => {
  const key = Object.keys(topo.objects)[0];
  const features = topojson.feature(topo, topo.objects[key]).features;

  svg.selectAll('path.prov').data(features).join('path')
    .attr('class','prov')
    .attr('d', path)
    .attr('fill', d => {
      const r = getRegion((d.properties && d.properties.name) || '');
      return r ? RCOLORS[r] + '55' : '#1a3d56';
    })
    .attr('stroke', '#0d2234').attr('stroke-width', 0.6)
    .on('mouseover', function(ev, d) {
      const nm = (d.properties && d.properties.name) || '';
      const r = getRegion(nm);
      d3.select(this).attr('fill', r ? RCOLORS[r] + '99' : '#1e4d6b');
      tip.innerHTML = `<span style="font-weight:600">${nm}</span>${r ? `<br><span style="opacity:.7;font-size:11px">${REGION_EN[r]} · ${REGION_VI[r]}</span>` : ''}`;
      tip.style.display = 'block'; moveTip(ev);
    })
    .on('mousemove', moveTip)
    .on('mouseout', function(ev, d) {
      const r = getRegion((d.properties && d.properties.name) || '');
      d3.select(this).attr('fill', r ? RCOLORS[r] + '55' : '#1a3d56');
      tip.style.display = 'none';
    });

  renderPins();
  renderIslands();
});

  {nameEn:'Phu Quoc Island',     nameVi:'Đảo Phú Quốc',         lon:103.97, lat:10.22, inset:false},
  {nameEn:'Con Dao Islands',     nameVi:'Quần đảo Côn Đảo',      lon:106.62, lat:8.69,  inset:false},
  {nameEn:'Ly Son Island',       nameVi:'Đảo Lý Sơn',            lon:109.13, lat:15.38, inset:false},
  {nameEn:'Phu Quy Island',      nameVi:'Đảo Phú Quý',           lon:108.93, lat:10.52, inset:false},
  {nameEn:'Co To Island',        nameVi:'Đảo Cô Tô',             lon:107.77, lat:20.97, inset:false},
  {nameEn:'Bach Long Vi Island', nameVi:'Đảo Bạch Long Vĩ',      lon:107.72, lat:20.13, inset:false},
  {nameEn:'Cat Ba Island',       nameVi:'Đảo Cát Bà',            lon:106.98, lat:20.73, inset:false},
  {nameEn:'Cu Lao Cham',         nameVi:'Cù Lao Chàm',           lon:108.52, lat:15.96, inset:false},
  // Archipelagos — shown in inset box (east of main map)
  {nameEn:'Paracel Islands',     nameVi:'Quần đảo Hoàng Sa',     lon:112.34, lat:16.50, inset:true},
  {nameEn:'Spratly Islands',     nameVi:'Quần đảo Trường Sa',    lon:114.33, lat:10.00, inset:true},
];

function renderIslands() {
  // ── Main-viewport islands ───────────────────────────────────────────────
  const mainIslands = ISLANDS.filter(i => !i.inset);
  mainIslands.forEach(isl => {
    const [px, py] = proj([isl.lon, isl.lat]);
    if (!px || !py || px < 0 || px > W || py < 0 || py > H) return;
    const g = svg.append('g').attr('transform', `translate(${px},${py})`).style('cursor','default');
    // Diamond marker
    g.append('path')
      .attr('d','M0,-5 L4,0 L0,5 L-4,0 Z')
      .attr('fill','#e8f0f7').attr('stroke','#5b9ec9').attr('stroke-width',1).attr('opacity',0.9);
    // Label — show on right side, or left if near right edge
    const side = px > W - 80 ? -6 : 6;
    const anchor = px > W - 80 ? 'end' : 'start';
    g.append('text')
      .attr('x', side).attr('y', -4)
      .attr('text-anchor', anchor)
      .attr('font-size','8px').attr('font-weight','700')
      .attr('fill','#c8dce9').attr('font-family','Arial,sans-serif')
      .text(isl.nameEn);
    g.append('text')
      .attr('x', side).attr('y', 4)
      .attr('text-anchor', anchor)
      .attr('font-size','7px').attr('font-weight','400')
      .attr('fill','#4a7a9b').attr('font-family','Arial,sans-serif')
      .text(isl.nameVi);
    // Tooltip
    g.on('mouseover', function(ev) {
      tip.innerHTML = `<span style="font-weight:600">${isl.nameEn}</span><br><span style="font-size:10px;opacity:.7">${isl.nameVi}</span>`;
      tip.style.display='block'; moveTip(ev);
    }).on('mousemove', moveTip).on('mouseleave', ()=>{ tip.style.display='none'; });
  });

  // ── Inset box for Hoàng Sa & Trường Sa ─────────────────────────────────
  const IW = 95, IH = 120, IX = W - IW - 6, IY = H - IH - 8;
  const insetProj = d3.geoMercator()
    .center([113.5, 13.5]).scale(380).translate([IW/2, IH/2]);
  const insetPath = d3.geoPath(insetProj);

  const insetG = svg.append('g').attr('transform', `translate(${IX},${IY})`);
  // Background
  insetG.append('rect').attr('width',IW).attr('height',IH)
    .attr('fill','#0a1c2b').attr('stroke','#1e3f59').attr('stroke-width',0.8).attr('rx',4);
  // Title
  insetG.append('text').attr('x',IW/2).attr('y',10)
    .attr('text-anchor','middle').attr('font-size','6px').attr('font-weight','700')
    .attr('fill','#4a7a9b').attr('font-family','Arial,sans-serif')
    .text('EAST SEA · BIỂN ĐÔNG');

  // Draw a tiny Vietnam coast reference
  d3.json('https://cdn.jsdelivr.net/npm/datamaps@0.5.10/src/js/data/vnm.topo.json').then(topo => {
    const key = Object.keys(topo.objects)[0];
    const features = topojson.feature(topo, topo.objects[key]).features;
    insetG.selectAll('path.inset-prov').data(features).join('path')
      .attr('class','inset-prov')
      .attr('d', insetPath)
      .attr('fill','#1a3d56').attr('stroke','#0d2234').attr('stroke-width',0.3);
  });

  // Island dots in inset
  ISLANDS.filter(i=>i.inset).forEach(isl => {
    const [px, py] = insetProj([isl.lon, isl.lat]);
    const g = insetG.append('g').attr('transform',`translate(${px},${py})`);
    g.append('circle').attr('r',3).attr('fill','#e8f0f7').attr('stroke','#5b9ec9').attr('stroke-width',0.8);
    g.append('text').attr('x',5).attr('y',-2)
      .attr('font-size','6px').attr('font-weight','700')
      .attr('fill','#c8dce9').attr('font-family','Arial,sans-serif')
      .text(isl.nameEn);
    g.append('text').attr('x',5).attr('y',5)
      .attr('font-size','5.5px').attr('fill','#4a7a9b').attr('font-family','Arial,sans-serif')
      .text(isl.nameVi);
    g.style('cursor','default')
      .on('mouseover',function(ev){
        tip.innerHTML=`<span style="font-weight:600">${isl.nameEn}</span><br><span style="font-size:10px;opacity:.7">${isl.nameVi}</span><br><span style="font-size:10px;opacity:.6">Sovereign territory of Vietnam</span>`;
        tip.style.display='block'; moveTip(ev);
      }).on('mousemove',moveTip).on('mouseleave',()=>{ tip.style.display='none'; });
  });

  // Border line connecting inset to right edge
  svg.append('line')
    .attr('x1',IX+IW).attr('y1',IY+IH/2)
    .attr('x2',W-2).attr('y2',IY+IH/2)
    .attr('stroke','#1e3f59').attr('stroke-width',0.5).attr('stroke-dasharray','3,2');
}

function renderPins() {
  svg.selectAll('g.pin').remove();
  DISHES.forEach((d, i) => {
    const [px, py] = proj([d.lon, d.lat]);
    if (!px || !py) return;
    const tc = TCOLORS[d.type];
    const g = svg.append('g').attr('class','pin')
      .attr('transform', `translate(${px},${py})`)
      .style('cursor','pointer');
    g.append('circle').attr('r', 5.5).attr('fill', tc).attr('stroke','#fff').attr('stroke-width',1.5).attr('opacity',0.9);
    g.on('click', () => selectDish(i))
     .on('mouseover', function(ev) {
       d3.select(this).select('circle').attr('r', 8);
       tip.innerHTML = `<span style="font-weight:600">${d.nameEn}</span><br><span style="font-size:10px;opacity:.75">${d.nameVi}</span>`;
       tip.style.display = 'block'; moveTip(ev);
     })
     .on('mousemove', moveTip)
     .on('mouseout', function() {
       d3.select(this).select('circle').attr('r', 5.5);
       tip.style.display = 'none';
     });
  });
}

function moveTip(ev) {
  let x = ev.clientX + 14, y = ev.clientY - 10;
  if (x + 230 > window.innerWidth) x = ev.clientX - 240;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}

// ── DETAIL PANEL ─────────────────────────────────────────────────────────
function selectDish(idx) {
  const d = DISHES[idx];
  selectedDish = idx;

  // Image
  const slug = dishSlug(d);
  const imgEl = document.getElementById('detail-img');
  const imgPh = document.getElementById('detail-img-ph');
  document.getElementById('detail-img-filename').textContent = slug + '.jpg';
  if (IMAGE_BASE_URL) {
    imgEl.src = IMAGE_BASE_URL + slug + '.jpg';
    imgEl.onload  = () => { imgEl.style.display = 'block'; imgPh.style.display = 'none'; };
    imgEl.onerror = () => { imgEl.style.display = 'none'; imgPh.style.display = 'flex'; };
    imgPh.style.display = 'none';
    imgEl.style.display = 'block';
  } else {
    imgEl.style.display = 'none';
    imgPh.style.display = 'flex';
  }

  document.getElementById('detail-name-en').textContent = d.nameEn;
  document.getElementById('detail-name-vi').textContent = d.nameVi;

  const rc = RCOLORS[d.region] || '#888';
  const tc = TCOLORS[d.type] || '#555';
  document.getElementById('detail-meta').innerHTML =
    `<span class="badge" style="background:${rc}22;color:${rc}">${REGION_EN[d.region] || d.region} · ${REGION_VI[d.region] || d.region}</span>` +
    `<span class="badge" style="background:${tc}22;color:${tc}">${d.type} · ${TYPE_VI[d.type]}</span>`;

  document.getElementById('ing-list').innerHTML = d.ingredients.map(ing =>
    `<div class="ingredient-item">
      <span class="ing-en">${ing.en}</span>
      <span class="ing-vi">· ${ing.vi}</span>
    </div>`
  ).join('');

  document.getElementById('detail-event-text').textContent = d.events;

  const panel = document.getElementById('detail');
  panel.classList.add('visible');

  // Highlight row
  document.querySelectorAll('.dish-row').forEach((r,i) => {
    r.classList.toggle('active', i === idx);
  });
}

document.getElementById('detail-close').addEventListener('click', () => {
  document.getElementById('detail').classList.remove('visible');
  document.querySelectorAll('.dish-row').forEach(r => r.classList.remove('active'));
  selectedDish = null;
});

// ── FILTERS ───────────────────────────────────────────────────────────────
function buildFilters() {
  const rf = document.getElementById('region-filters');
  const tf = document.getElementById('type-filters');
  rf.innerHTML = '';
  tf.innerHTML = '';

  REGIONS.filter(r => DISHES.some(d => d.region === r)).forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.innerHTML = `<span style="display:block;font-size:11px;font-weight:700;line-height:1.2">${REGION_EN[r]}</span><span style="display:block;font-size:9px;opacity:.65;line-height:1.2">${REGION_VI[r]}</span>`;
    btn.style.background = 'transparent';
    btn.style.color = RCOLORS[r];
    btn.style.padding = '4px 9px';
    btn.style.lineHeight = '1';
    btn.style.borderColor = RCOLORS[r] + '88';
    btn.addEventListener('click', () => {
      activeRegion = activeRegion === r ? null : r;
      applyFilters();
      document.querySelectorAll('#region-filters .filter-btn').forEach(b => b.classList.remove('active'));
      if (activeRegion) {
        btn.classList.add('active');
        btn.style.background = RCOLORS[r];
        btn.style.color = '#fff';
      } else {
        btn.style.background = 'transparent';
        btn.style.color = RCOLORS[r];
      }
    });
    rf.appendChild(btn);
  });

  TYPES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = `${t} · ${TYPE_VI[t]}`;
    btn.style.color = TCOLORS[t];
    btn.style.borderColor = TCOLORS[t] + '88';
    btn.addEventListener('click', () => {
      activeType = activeType === t ? null : t;
      applyFilters();
      document.querySelectorAll('#type-filters .filter-btn').forEach(b => {
        b.classList.remove('active');
        b.style.background = 'transparent';
        b.style.color = TCOLORS[b.dataset.type];
      });
      btn.dataset.type = t;
      if (activeType) {
        btn.classList.add('active');
        btn.style.background = TCOLORS[t];
        btn.style.color = '#fff';
      }
    });
    btn.dataset.type = t;
    tf.appendChild(btn);
  });
}

function matchesSearch(d) {
  if (!activeSearch) return true;
  const q = activeSearch.toLowerCase();
  return d.nameEn.toLowerCase().includes(q) || d.nameVi.toLowerCase().includes(q);
}

function applyFilters() {
  const rows = document.querySelectorAll('.dish-row');
  rows.forEach((row, i) => {
    const d = DISHES[i];
    const show = matchesSearch(d) && (!activeRegion || d.region === activeRegion) && (!activeType || d.type === activeType);
    row.classList.toggle('dimmed', !show);
  });
  svg.selectAll('g.pin').each(function(_, i) {
    const d = DISHES[i];
    if (!d) return;
    const show = matchesSearch(d) && (!activeRegion || d.region === activeRegion) && (!activeType || d.type === activeType);
    d3.select(this).select('circle').attr('opacity', show ? 0.9 : 0.12);
  });
}

// ── DISH LIST ─────────────────────────────────────────────────────────────
function buildList() {
  const dl = document.getElementById('dish-list');
  dl.innerHTML = DISHES.map((d, i) => `
    <div class="dish-row" onclick="selectDish(${i})">
      <span class="row-dot" style="background:${TCOLORS[d.type]}"></span>
      <div>
        <div class="row-en">${d.nameEn}</div>
        <div class="row-vi">${d.nameVi}</div>
        <div class="row-region" style="color:${RCOLORS[d.region]}99">${REGION_EN[d.region] || d.region} <span style="opacity:.55;font-size:9px">· ${REGION_VI[d.region] || d.region}</span></div>
      </div>
    </div>`).join('');
}

document.getElementById('search-input').addEventListener('input', function() {
  activeSearch = this.value.trim();
  applyFilters();
});

buildFilters();
buildList();
</script>
